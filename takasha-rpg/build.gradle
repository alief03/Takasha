plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.21'
    id 'maven-publish'
}

def globalModVersion = '1.0.0'
def globalGroup = 'net.takasha.rpg'
def globalBaseName = 'Takasha-RPG'

version = "${globalModVersion}+26.2"
group = globalGroup

base {
    archivesName = globalBaseName
}

repositories {
    maven {
        name = "Fabric"
        url = "https://maven.fabricmc.net/"
    }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

tasks.named('build') {
    doLast {
        def builtJar = tasks.findByName('remapJar') ? tasks.remapJar.archiveFile.get().asFile : tasks.jar.archiveFile.get().asFile
        copy {
            from builtJar
            into file("${rootDir}/../Hasil mod")
        }
    }
}
