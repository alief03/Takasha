plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.21'
    id 'maven-publish'
}

def globalModVersion = '1.9.5'
def globalGroup = 'net.takasha.rpg'
def globalBaseName = 'Takasha-RPG'

version = "${globalModVersion}+26.2"
group = globalGroup

base {
    archivesName = globalBaseName
}

repositories {
    maven {
        name = "LocalRepo"
        url = uri("${projectDir}/local-repo")
    }
    maven {
        name = "Fabric"
        url = "https://maven.fabricmc.net/"
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    implementation 'org.yaml:snakeyaml:2.2'
    include 'org.yaml:snakeyaml:2.2'
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

tasks.named('test') {
    failOnNoDiscoveredTests = false
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

tasks.register('runColorTests', JavaExec) {
    group = 'verification'
    description = 'Executes the automated Color Code Engine verification test suite.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'net.takasha.rpg.test.TakashaColorParserAutoTest'
}

tasks.register('runSuggestionTests', JavaExec) {
    group = 'verification'
    description = 'Executes the automated Command & Chat Suggestion verification test suite.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'net.takasha.rpg.test.TakashaCommandSuggestionAutoTest'
}

tasks.register('runParityTests', JavaExec) {
    group = 'verification'
    description = 'Executes the automated MMOItems 1:1 REA parity verification test suite.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'net.takasha.rpg.test.TakashaParityAutoTest'
}

tasks.register('runStatTests', JavaExec) {
    group = 'verification'
    description = 'Executes the automated MMOItems 28-stat verification test suite.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'net.takasha.rpg.test.MMOStatCombatAutoTest'
}

tasks.register('runEnchantTests', JavaExec) {
    group = 'verification'
    description = 'Executes the automated 336 Custom Enchantments verification test suite.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'net.takasha.rpg.test.TakashaEnchantAutoTest'
}

tasks.register('runMultiTypeAuditTests', JavaExec) {
    group = 'verification'
    description = 'Executes the automated Multi-Type Enchant & Stat Audit verification test suite.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'net.takasha.rpg.test.TakashaMultiTypeAuditAutoTest'
}

tasks.register('runStatIntegrationTests', JavaExec) {
    group = 'verification'
    description = 'Executes the automated Full Stat Integration & REA Audit verification test suite.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'net.takasha.rpg.test.TakashaStatIntegrationAutoTest'
}

tasks.named('build') {
    doLast {
        def builtJar = tasks.findByName('remapJar') ? tasks.remapJar.archiveFile.get().asFile : tasks.jar.archiveFile.get().asFile
        copy {
            from builtJar
            into file("${rootDir}/../Hasil mod")
        }
    }
}
