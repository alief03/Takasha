plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.21'
    id 'maven-publish'
}

def globalModVersion = project.findProperty('mod_version') ?: '2.2.0'
def globalGroup = project.findProperty('maven_group') ?: 'net.sakura.weapons'
def globalBaseName = project.findProperty('archives_base_name') ?: 'Takasha'

version = "${globalModVersion}+26.2"
group = globalGroup

base {
    archivesName = globalBaseName
}

repositories {
    maven {
        name = "Fabric"
        url = "https://maven.fabricmc.net/"
    }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    compileOnly files("${rootDir}/../referensi-rp/Flashback-0.43.4-for-MC26.2.jar")
}

sourceSets {
    main {
        resources {
            srcDirs += [
                "${rootDir}/shared-resources"
            ]
        }
    }
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

tasks.named('build') {
    doLast {
        def builtJar = tasks.findByName('remapJar') ? tasks.remapJar.archiveFile.get().asFile : tasks.jar.archiveFile.get().asFile
        copy {
            from builtJar
            into file("${rootDir}/../Hasil mod")
        }
    }
}
